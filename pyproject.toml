[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldwatch-ai"
version = "0.1.0"
description = "Warehouse environmental monitoring and risk intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "duckdb>=1.2",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pytz>=2024.1",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.40",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["coldwatch"]
omit = ["*/__init__.py"]
